<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <title>Escáner QR - Asistencia</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        body{
            margin:0;
            background:#f0f2f5;
            font-family:Arial,sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card{
            background:white;
            padding:30px;
            width:350px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.15);
            text-align:center;
        }

        h2{
            color:#003366;
        }

        #reader{
            width:300px;
            margin:auto;
        }

        .mensaje{
            margin-top:20px;
            color:#666;
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>📷 Escanear Código QR</h2>

    <p>
        Coloca el código QR frente a la cámara.
    </p>

    <div id="reader"></div>

    <div class="mensaje">
        Sistema de Asistencia - Tecsup
    </div>

</div>

<script>

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras()

.then(cameras => {

    if(cameras && cameras.length){

        html5QrCode.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,
                qrbox: 250
            },

            function(decodedText){

                html5QrCode.stop();

                try{

                    const url = new URL(decodedText);

                    const codigo =
                        url.searchParams.get("codigo");

                    if(codigo){

                        if(codigo){
                        
                            if(window.opener){
                        
                                window.opener.location.href =
                                "https://script.google.com/macros/s/AKfycby76kspyi3WEs4wQBYo3CM-dDCuCkk3NYtHhTuRm8MbTMb7_JEG8pKvTreLqD6x_WEziw/exec?codigo="
                                + codigo;
                        
                            }
                        
                            window.close();
                        
                        }

                    }

                    else{

                        alert("El QR no contiene un parámetro código.");

                    }

                }

                catch(error){

                    alert("QR inválido.");

                }

            },

            function(errorMessage){
                // ignorar errores de lectura
            }

        );

    }

})

.catch(error => {

    alert(
        "No se pudo acceder a la cámara.\n\n" +
        error
    );

});

</script>

</body>
</html>
